# Vigie : collecte de l'actualité (2 éditions par jour) + publication sur GitHub Pages (gratuit)
#  - 2 éditions : environ 6 h 50 et 18 h 50 (heure de Paris en été ; 5 h 50 et 17 h 50 en hiver)
#  - à chaque envoi de code sur « main » : tests, collecte, publication
#  - « Run workflow » (onglet Actions) : édition à la demande
# La mémoire entre deux éditions, c'est le site déjà publié (VIGIE_PREV_URL) : rien n'est enregistré dans le dépôt.
name: Publier Vigie
on:
  push:
    branches: [main]
  schedule:
    - cron: '50 4 * * *'
    - cron: '50 16 * * *'
  workflow_dispatch:
permissions:
  contents: write    # relance mensuelle (voir « Garder les éditions actives »)
  pages: write
  id-token: write
  models: read      # résumés gratuits via GitHub Models (facultatif, voir README)
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tests
        if: github.event_name == 'push'
        run: npm test
      - name: Collecter l'actualité et rédiger les résumés
        env:
          VIGIE_PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}      # facultatif : clé gratuite Google AI Studio
          GITHUB_TOKEN: ${{ github.token }}                    # repli : GitHub Models (gratuit, quota limité)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}               # facultatif : forcer un modèle
          VIGIE_NO_LLM: ${{ vars.VIGIE_NO_LLM }}               # mettre 1 pour couper toute IA
        run: npm run collect
      - name: Construire l'application
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Garder les éditions actives
        # GitHub suspend les tâches planifiées d'un dépôt sans activité pendant 60 jours : un commit vide tous les ~40 jours suffit.
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "vigie-bot"
            git config user.email "vigie-bot@users.noreply.github.com"
            git commit --allow-empty -m "Relance automatique (garde les éditions actives)"
            git push
          fi
  deploy:
    needs: edition
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # Application Android (APK) : coque Capacitor qui charge le site publié ci-dessus. Construite à chaque envoi de code
  # (pas aux éditions planifiées) et publiée dans la release « apk » : lien de téléchargement stable, voir README.
  apk:
    needs: deploy
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # le SDK Android est déjà installé sur les machines ubuntu-latest de GitHub (ANDROID_HOME)
      - run: npm install --no-audit --no-fund
      - name: Adresse de l'app web
        run: |
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ "$REPO" = "$OWNER.github.io" ]; then echo "SITE_URL=https://$OWNER.github.io/" >> "$GITHUB_ENV"; else echo "SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"; fi
      - run: npm run configure
      - run: npx cap add android
      - run: npm run patch
      - run: npx cap sync android
      - name: Construction de l'APK
        working-directory: android-shell/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../semaphore.apk
      - uses: actions/upload-artifact@v4
        with:
          name: semaphore-apk
          path: semaphore.apk
      - name: Release « apk » (lien de téléchargement stable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Sémaphore — APK Android
          body: |
            APK construit automatiquement depuis ${{ github.sha }}.
            Installer « semaphore.apk » sur le téléphone (autoriser l'installation depuis le navigateur).
            L'interface se met à jour seule avec le site : réinstaller l'APK n'est utile que si la coque Android change.
          files: semaphore.apk
          make_latest: false
