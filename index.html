<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sémaphore</title>
  <meta name="description" content="Sémaphore : revue de presse personnelle par secteur, résumée en français, deux éditions par jour.">
  <meta name="theme-color" content="#FAF8F5">
  <meta name="color-scheme" content="light dark">
  <script>window.__t0=Date.now();try{var t=localStorage.getItem('semaphore:theme')||localStorage.getItem('vigie:theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}</script>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sémaphore">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    /* écran de démarrage : affiché dès le premier rendu, avant que le CSS et le JS soient chargés */
    html{background:#FAF8F5}
    html[data-theme="dark"]{background:#141216}
    body{margin:0}
    .splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#FAF8F5;transition:opacity .35s ease}
    html[data-theme="dark"] .splash{background:#141216}
    .splash.out{opacity:0;pointer-events:none}
    .splash .mark{width:88px;height:88px;border-radius:24px;background:#2B2135;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(43,33,53,.30);animation:splash-pulse 1.5s ease-in-out infinite}
    .splash .body{fill:#EEE8F8}
    .splash .lamp{fill:#F08A6E}
    .splash .beam{fill:#F08A6E;opacity:.45;animation:splash-beam 1.5s ease-in-out infinite}
    @keyframes splash-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    @keyframes splash-beam{0%,100%{opacity:.12}50%{opacity:.55}}
    @media (prefers-reduced-motion:reduce){.splash .mark,.splash .beam{animation:none}}
  </style>
  <link rel="stylesheet" href="app.css">
  <!-- polices : chargées sans bloquer l'affichage -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
</head>
<body>
  <div id="root"></div>
  <div id="splash" class="splash" role="status" aria-label="Sémaphore"><div class="mark"><svg width="52" height="52" viewBox="0 0 48 48" aria-hidden="true"><path class="beam" d="M24 12.5 L2 6 L2 19 Z"/><path class="body" d="M19.5 40 L28.5 40 L27.2 18 L20.8 18 Z"/><rect class="body" x="17.5" y="15.5" width="13" height="3.5" rx="1"/><rect class="lamp" x="19.8" y="9.5" width="8.4" height="6.5" rx="1.2"/><path class="body" d="M18.8 10 L29.2 10 L24 5 Z" stroke="#EEE8F8" stroke-width="1.6" stroke-linejoin="round"/><path class="body" d="M31.5 40 V31.5 L37 27 L42.5 31.5 V40 Z"/><rect class="body" x="4" y="40" width="42" height="4" rx="2"/></svg></div></div>
  <noscript>Sémaphore a besoin de JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
