<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Sémaphore</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;600&display=swap">
  <style>
    :root { --bg: #FAF8F5; --surface: #FFFFFF; --text: #2B2135; --muted: #5C5566; --border: #D8D2CC; --crit: #B3261E; --btn: #5A3E8E; --btn-fg: #FFFFFF; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141216; --surface: #1F1B24; --text: #ECE7F4; --muted: #B3ABBF; --border: #3A3342; --crit: #F2B8B5; --btn: #C3B2EC; --btn-fg: #1F1B24; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 400 16px/1.5 Inter, system-ui, sans-serif; padding: 24px 16px; }
    main { width: 100%; max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { margin: 0; font: 800 26px/1.2 Manrope, system-ui, sans-serif; }
    p { margin: 0; color: var(--muted); }
    button, a.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 48px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font: 600 16px/1 Inter, system-ui, sans-serif; text-decoration: none; cursor: pointer; }
    a.btn { background: var(--btn); color: var(--btn-fg); border: 0; }
    button:disabled { opacity: .5; }
    #status { min-height: 24px; font-size: 14px; }
    #status.err { color: var(--crit); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>Sémaphore</h1>
    <p id="lead">Connecte-toi avec ton compte Google : l’application Android retrouvera tes favoris et tes réglages synchronisés.</p>
    <button id="go" type="button" disabled>
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      <span id="go-label">Continuer avec Google</span>
    </button>
    <a id="back" class="btn" hidden>Revenir dans Sémaphore</a>
    <span id="status" role="status"></span>
  </main>
  <script type="module" src="auth.js"></script>
</body>
</html>
